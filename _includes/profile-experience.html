<ul style="list-style:none; padding-left:0;">
  {% for item in site.data.profile.experience %}
    <li style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
      <img src="{{ item.logo | relative_url }}" alt="{{ item.logo_alt }}" style="width:104px; height:60px; object-fit:contain;">
      <span>{{ item.organization }}, <strong>{{ item.role }}</strong>, {{ item.period }}</span>
    </li>
  {% endfor %}
</ul>
