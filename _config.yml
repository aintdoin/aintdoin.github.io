# Basic Site Settings
locale                   : "en-US"
title                    : "Runquan Gui"
title_separator          : "-"
name                     : &name "Runquan Gui"
description              : &description "Runquan Gui is a Ph.D. student at USTC researching LLM post-training, agents, reinforcement learning, and world models."
url                      : https://aintdoin.github.io
baseurl                  : ""
repository               : "aintdoin/aintdoin.github.io"

# Site Author
author:
  avatar           : "me.png"
  name             : "Runquan Gui (桂润泉)"
  bio              : "Ph.D. Student at USTC"
  email            : "rqgui@mail.ustc.edu.cn"
  googlescholar    : https://scholar.google.com/citations?user=ZjJcjQUAAAAJ
  github           : "aintdoin"

# Site Settings
breadcrumbs              : false
future                   : false
atom_feed:
  hide                   : true

# Social profiles
social:
  type                   : Person
  name                   : "Runquan Gui"
  links:
    - https://scholar.google.com/citations?user=ZjJcjQUAAAAJ
    - https://github.com/aintdoin
# Reading Files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - CONTRIBUTING.md
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Default layout for public pages
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Asia/Shanghai

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
# GitHub Pages safe-mode allowlist
whitelist:
  - jekyll-sitemap


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
